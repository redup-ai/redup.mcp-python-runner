[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redup-mcp-python-runner"
dynamic = ["version"]
description = "MCP Streamable HTTP service for sandboxed ephemeral Python execution."
authors = [{ name = "REDUP" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
keywords = ["mcp", "sandbox", "python", "execution", "ai", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Security",
]
dependencies = ["fastmcp>=2.0,<3", "tomli-w>=1.0"]

[project.urls]
Homepage = "https://github.com/redup-ai/redup.mcp-python-runner/blob/master/README.md"
Repository = "https://github.com/redup-ai/redup.mcp-python-runner"
Issues = "https://github.com/redup-ai/redup.mcp-python-runner/issues"

[project.scripts]
redup-mcp-python-runner = "redup_mcp_python_runner.__main__:main"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["src/redup_mcp_python_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
